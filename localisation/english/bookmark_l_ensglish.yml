l_english:
    THE_AGE_OF_ASSUMPTION: "The Age of Assumption"
    THE_AGE_OF_ASSUMPTION_NAME: "The Age of Assumption"
    THE_AGE_OF_ASSUMPTION_DESC: "Es el 18 de Septiembre de 1886. Chile acaba de comenzar a recibir los primeros masivos ingresos de la industria Salitrera. El Presidente José Manuel Balmaceda ha sido electo, sus planes contemplan emplear la efimera riqueza salitrera para\nmodernizar Chile, y convertirlo en la Potencia que siempre estuvo destinado a ser.  Pero los Intereses de la Oligarquia conservardora se alinean con los de los Magnates Ingleses.\n¿Podra el Presidente Desarrollista completar su cruzada por el Alma de Chile? ¿O sera superado por el dinero malhabido de los Magnates Ingleses?"