l_english:
 CHL_NITRATE_BOOM_TITLE: "La fiebre blanca: auge del salitre"
 CHL_NITRATE_BOOM_DESC: "El descubrimiento de nuevos yacimientos de salitre en la región de Antofagasta y Tarapacá ha desencadenado una fiebre inversora sin precedentes. La demanda mundial de fertilizantes y explosivos dispara los precios. Nuestras arcas comienzan a llenarse, pero debemos decidir cómo aprovechar esta bonanza: ¿fortalecemos la infraestructura del país o atraemos capital extranjero rebajando los impuestos al mineral?"
 CHL_NITRATE_BOOM_OPT_A: "Construir ferrocarriles y puertos para el desarrollo nacional"
 CHL_NITRATE_BOOM_OPT_B: "Bajar los aranceles y dejar entrar al capital británico"
 CHL_FLACH_1866_TITLE: "El Misterioso Submarino Flach"
 CHL_FLACH_1866_DESC: "En los astilleros de Valparaíso, un ingeniero germano-chileno, Karl Flach, presentó un artefacto revolucionario: un sumergible capaz de navegar bajo las aguas. El proyecto despertó curiosidad y recelo entre la élite chilena, que veía en él tanto una promesa de modernización como un riesgo para la estabilidad. El submarino realizó pruebas exitosas, pero en un fatídico ensayo se hundió con toda su tripulación, dejando tras de sí rumores de sabotaje y conspiración."
 CHL_FLACH_1866_OPT_A: "Apoyar la innovación"
 CHL_FLACH_1866_OPT_B: "Silenciar el proyecto"
 CHL_FLACH_1866_OPT_C: "Investigar el accidente"